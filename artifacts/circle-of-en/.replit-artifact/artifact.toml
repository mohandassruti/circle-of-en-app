kind = "web"
previewPath = "/"
title = "Circle of En"
version = "1.0.0"
id = "artifacts/circle-of-en"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24401

[services.development]
run = "pnpm --filter @workspace/circle-of-en run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/circle-of-en", "run", "build" ]
publicDir = "artifacts/circle-of-en/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24401"
BASE_PATH = "/"
